# Cloudflare Workers config for the Mailbun site.
#
# This is an assets-only Worker: there's no `main` script, so Cloudflare just
# serves the files in `directory` straight from its edge. Nothing here runs
# server-side code, so it stays on the free tier's static-asset allowance
# rather than burning Worker requests.
#
# Deploys run automatically via Workers Builds on push to main. To deploy
# by hand from this directory instead:  npx wrangler deploy
# Must match the Worker name in the Cloudflare dashboard, or Workers Builds
# flags the mismatch and opens a PR to correct it.
name = "mailbun"
compatibility_date = "2026-08-18"

[assets]
# The site lives at the repo root, so everything not listed in .assetsignore
# gets uploaded. If you ever add a build step, point this at the output dir
# instead and delete .assetsignore.
directory = "."

# Custom domains. custom_domain = true means Cloudflare owns the DNS record
# and the certificate for these hostnames — so the zone must NOT contain an
# A/AAAA/CNAME for them, or the deploy fails with "already has externally
# managed DNS records". The MX and SPF TXT records for email forwarding are
# unaffected and must stay.
[[routes]]
pattern = "mailbun.org"
custom_domain = true

[[routes]]
pattern = "www.mailbun.org"
custom_domain = true
